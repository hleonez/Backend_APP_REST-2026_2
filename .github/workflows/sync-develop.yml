name: Sync develop with main

# Después de cada merge a `main`, adelanta `develop` hasta ese commit
# cuando `develop` es ancestro de `main`. No usa --force: si `develop`
# tiene commits que `main` no tiene, el job falla y no reescribe historia.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-main-develop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward develop to main
        run: |
          git fetch origin develop
          echo "HEAD (main): $(git rev-parse HEAD)"
          echo "origin/develop: $(git rev-parse origin/develop)"
          if git merge-base --is-ancestor origin/develop HEAD; then
            git push origin HEAD:develop
          else
            echo "develop tiene commits que main no tiene. No se hace force-push."
            exit 1
          fi
