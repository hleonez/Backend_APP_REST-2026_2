name: Sync main -> develop

# Después de cada merge a `main`, abre (o reutiliza) un Pull Request de
# `main` hacia `develop` para que `develop` quede alineada con `main`, y le
# activa auto-merge para que se fusione solo en cuanto pasen los checks
# obligatorios (CI + Branch Policy). El merge SIEMPRE es un merge commit
# real (`--merge`, nunca `--squash` ni `--rebase`), para que `main` quede
# como ancestro directo de `develop` y el historial no se reescriba.
#
# Esta es la ÚNICA vía permitida para llevar cambios de `main` a `develop`:
# el PR lo crea siempre este workflow con `github-actions[bot]` como autor.
# La política de ramas (`branch-policy.yml`) usa esa condición para permitir
# esta excepción puntual.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-pr:
    name: Abrir/actualizar PR de sincronización y activar auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar si develop ya está al día con main
        id: diff
        run: |
          git fetch origin main develop
          if git diff --quiet origin/develop origin/main; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Buscar PR de sincronización existente
        id: existing_pr
        if: steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=$(gh pr list \
            --base develop \
            --head main \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Crear PR de sincronización main -> develop
        if: steps.diff.outputs.has_diff == 'true' && steps.existing_pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head main \
            --title "chore: sync main -> develop" \
            --body "PR automático creado por el workflow de sincronización. Alinea \`develop\` con los últimos cambios fusionados en \`main\`. Se fusiona solo (auto-merge, merge commit) en cuanto pasan los checks obligatorios (CI + Branch Policy). No requiere revisión manual."

      - name: Nada que sincronizar
        if: steps.diff.outputs.has_diff == 'false'
        run: echo "develop ya está al día con main, no se crea PR."

      - name: Activar auto-merge (merge commit) en el PR de sincronización
        if: steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="${{ steps.existing_pr.outputs.number }}"

          if [ -z "$pr_number" ]; then
            # El PR se acaba de crear en el paso anterior; volvemos a
            # buscarlo para obtener su número (gh pr create no lo devuelve
            # como JSON directamente).
            pr_number=$(gh pr list \
              --base develop \
              --head main \
              --state open \
              --json number \
              --jq '.[0].number // empty')
          fi

          if [ -z "$pr_number" ]; then
            echo "No se pudo encontrar el PR de sincronización main -> develop; no se puede activar auto-merge."
            exit 1
          fi

          echo "Activando auto-merge (merge commit real) en el PR #$pr_number..."
          gh pr merge "$pr_number" --auto --merge
