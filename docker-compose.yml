services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-mental_health_app}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:?JWT_EXPIRES_IN is required}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_API_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2:1.5b
      - USE_OLLAMA=true
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - app-network

  postgres:
    image: postgres:14
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mental_health_app}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mental_health_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    networks:
      - app-network

  # Servicio para inicializar Ollama con el modelo
  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      - ollama
    command: >
      sh -c "
      ATTEMPT=0;
      while [ $$ATTEMPT -lt 24 ]; do 
        curl -f http://ollama:11434/api/tags >/dev/null 2>&1 && break;
        ATTEMPT=$$((ATTEMPT+1));
        sleep 5;
      done;
      curl -s http://ollama:11434/api/tags | grep -q qwen2 || curl -X POST http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{\"name\":\"qwen2:1.5b\"}' --no-buffer;
      echo 'Ollama ready';
      "
    networks:
      - app-network
    restart: "no"

volumes:
  ollama_data:
    driver: local
  postgres_data:
    driver: local

networks:
  app-network:
    name: app-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-10.201.3.0/24}
          gateway: ${DOCKER_NETWORK_GATEWAY:-10.201.3.1}