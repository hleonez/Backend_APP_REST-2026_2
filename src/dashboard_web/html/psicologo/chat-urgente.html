<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat urgente · REST</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="bg-red-950 text-white min-h-screen">
  <main class="max-w-2xl mx-auto p-4 flex flex-col min-h-screen">
    <header class="py-4 border-b border-red-800">
      <p class="text-xs tracking-widest font-bold text-red-200">URGENTE</p>
      <h1 class="text-2xl font-bold">Chat con el estudiante</h1>
    </header>
    <section id="mensajes" class="flex-1 overflow-y-auto py-4 space-y-3"></section>
    <form id="formulario" class="flex gap-2 py-4">
      <input id="entrada" class="flex-1 rounded-md px-3 py-2 text-neutral-900" placeholder="Escribe al estudiante" autocomplete="off" />
      <button class="rounded-md bg-white text-red-900 font-bold px-4" type="submit">Enviar</button>
    </form>
  </main>
  <script src="../../js/chat-urgente.js"></script>
  <script src="../../js/alerta-urgente.js"></script>
</body>
</html>
